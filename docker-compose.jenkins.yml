services:
  jenkins:
    image: jenkins/jenkins:lts-jdk21
    container_name: library-jenkins
    restart: unless-stopped
    ports:
      - "8081:8080"   # Jenkins web UI (8080 is taken by the Spring Boot backend on this machine)
      - "50000:50000" # agent communication (not needed for this single-node setup, harmless to expose)
    volumes:
      - jenkins_home:/var/jenkins_home

volumes:
  jenkins_home:
