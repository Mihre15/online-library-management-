# Shared configuration for every test context (@DataJpaTest slices, @SpringBootTest, etc.),
# regardless of which Spring profile (if any) is active. Keeps tests isolated from the
# demo/prod seed data (data.sql) and provides the JWT secret required to instantiate
# AuthService in any context that loads it.
app.jwt.secret=test-only-secret-key-at-least-32-bytes-long
spring.sql.init.mode=never
