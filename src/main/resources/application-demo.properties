spring.datasource.url=jdbc:h2:mem:library;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.h2.console.enabled=true

# Local-only secret for the demo profile. Production uses JWT_SECRET from the environment.
app.jwt.secret=library-management-demo-secret-key-32-bytes
